name: Aggiorna feed Mira

on:
  schedule:
    - cron: "0 2 * * *"   # ogni notte alle 02:00 UTC (03:00/04:00 ora italiana)
  workflow_dispatch:       # permette di lanciarlo a mano dal tab Actions

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera feed XML da Liberty
        run: python genera_feed_mira.py

      - name: Genera feed Ambesa
        run: python genera_feed_ambesa.py
        continue-on-error: true

      - name: Salva il feed nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add feed_mira_completo.xml
          git add feed_ambesa_motori.xml || true
          git diff --staged --quiet || git commit -m "Aggiornamento feed Mira e Ambesa $(date +%F)"
          git push
